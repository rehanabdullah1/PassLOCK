name: Build PassLOCK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode Mod
        uses: geode-sdk/build-geode-mod@main

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: PassLOCK
          path: "*.geode"
